    /* =========================================================================
       2. SETTLEMENT & MIN CASH FLOW ALGORITHM (N빵 최소 송금)
       ========================================================================= */
    function calculateSettlement(friends, expenses) {
      const friendMap = new Map(friends.map(f => [f.id, f]));
      const paidMap = {};
      const owedMap = {};
      friends.forEach(f => { paidMap[f.id] = 0; owedMap[f.id] = 0; });

      let totalExpenses = 0;

      expenses.forEach(exp => {
        const amount = Math.round(exp.amount) || 0;
        if (amount <= 0) return;
        totalExpenses += amount;

        paidMap[exp.payerId] = (paidMap[exp.payerId] || 0) + amount;

        const participants = exp.participantIds && exp.participantIds.length > 0
          ? exp.participantIds.filter(id => friendMap.has(id))
          : friends.map(f => f.id);

        if (participants.length === 0) return;

        const baseShare = Math.floor(amount / participants.length);
        const remainder = amount % participants.length;

        participants.forEach((pid, idx) => {
          const share = baseShare + (idx < remainder ? 1 : 0);
          owedMap[pid] = (owedMap[pid] || 0) + share;
        });
      });

      const balances = friends.map(f => ({
        id: f.id,
        net: (paidMap[f.id] || 0) - (owedMap[f.id] || 0)
      }));

      // Min Cash Flow Greedy Algorithm
      const transfers = [];
      const working = balances.map(b => ({ ...b }));

      while (true) {
        let maxCreditor = working[0];
        let maxDebtor = working[0];

        for (const b of working) {
          if (b.net > maxCreditor.net) maxCreditor = b;
          if (b.net < maxDebtor.net) maxDebtor = b;
        }

        if (Math.abs(maxCreditor.net) <= 0.01 && Math.abs(maxDebtor.net) <= 0.01) break;

        const transferAmount = Math.min(maxCreditor.net, -maxDebtor.net);
        if (transferAmount <= 0) break;

        const fromFriend = friendMap.get(maxDebtor.id);
        const toFriend = friendMap.get(maxCreditor.id);

        if (fromFriend && toFriend) {
          transfers.push({
            fromId: fromFriend.id,
            fromName: fromFriend.name,
            toId: toFriend.id,
            toName: toFriend.name,
            toAccount: toFriend.accountInfo,
            amount: Math.round(transferAmount)
          });
        }

        maxCreditor.net -= transferAmount;
        maxDebtor.net += transferAmount;
      }

      const friendSummaries = friends.map(f => ({
        friend: f,
        totalPaid: paidMap[f.id] || 0,
        totalOwed: owedMap[f.id] || 0,
        netBalance: (paidMap[f.id] || 0) - (owedMap[f.id] || 0)
      }));

      return {
        totalExpenses,
        expenseCount: expenses.length,
        transfers,
        friendSummaries
      };
    }

    function formatKakaoMessage() {
      const settlement = calculateSettlement(appState.friends, appState.expenses);
      let text = `✈️ [${appState.tripInfo.title}] 최종 경비 정산 안내\n`;
      text += `💰 총 지출: ${settlement.totalExpenses.toLocaleString()}원 (${settlement.expenseCount}건)\n`;
      text += `👥 참여 멤버: ${appState.friends.length}명\n`;
      text += `─────────────────────\n`;

      if (settlement.transfers.length === 0) {
        text += `🎉 모든 정산이 완료되었습니다! (송금할 내역 없음)\n`;
      } else {
        text += `🚀 [최소 송금 안내 (누가 누구에게)]\n`;
        settlement.transfers.forEach((t, i) => {
          text += `${i + 1}. ${t.fromName} ➡️ ${t.toName}: ${t.amount.toLocaleString()}원\n`;
          if (t.toAccount) text += `   └ 💳 계좌: ${t.toAccount}\n`;
        });
        text += `\n─────────────────────\n`;
        text += `📊 [멤버별 요약]\n`;
        settlement.friendSummaries.forEach(s => {
          if (s.netBalance > 0) {
            text += `• ${s.friend.name}: 결제 ${s.totalPaid.toLocaleString()}원 (총 ${s.netBalance.toLocaleString()}원 받기)\n`;
          } else if (s.netBalance < 0) {
            text += `• ${s.friend.name}: 결제 ${s.totalPaid.toLocaleString()}원 (총 ${Math.abs(s.netBalance).toLocaleString()}원 보내기)\n`;
          } else {
            text += `• ${s.friend.name}: 정산 완료 (0원)\n`;
          }
        });
      }
      text += `─────────────────────\n`;
      text += `확인 후 송금 부탁드립니다! 🎒`;
      return text;
    }

    /* =========================================================================
       3. TOAST & UTILS
       ========================================================================= */
    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const text = document.getElementById('toastMessage');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('-translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-24', 'opacity-0');
      }, 2500);
    }

    function calculateDDay() {
      try {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const start = new Date(appState.tripInfo.startDate);
        start.setHours(0, 0, 0, 0);
        const diff = Math.ceil((start.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day';
        if (diff > 0) return `D-${diff}`;
        return `D+${Math.abs(diff)}`;
      } catch {
        return 'D-Day';
      }
    }

    function calculateTotalDays() {
      try {
        const s = new Date(appState.tripInfo.startDate);
        const e = new Date(appState.tripInfo.endDate);
        const diff = Math.ceil((e.getTime() - s.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        return isNaN(diff) || diff < 1 ? 3 : diff;
      } catch {
        return 3;
      }
    }

    /* =========================================================================
       4. GITHUB GIST SYNC ENGINE
       ========================================================================= */
    const GIST_FILENAME = 'travel_trip_data.json';
    let pushTimeout = null;

    function debouncePush() {
      if (pushTimeout) clearTimeout(pushTimeout);
      pushTimeout = setTimeout(() => {
        pushToGist(false);
      }, 1500);
    }

    async function fetchFromGist(silent = false) {
      if (!syncConfig.gistId) return;
      if (!silent) showToast('GitHub에서 최신 데이터를 가져오는 중...');
      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (syncConfig.githubToken) headers['Authorization'] = `token ${syncConfig.githubToken}`;

        const res = await fetch(`https://api.github.com/gists/${syncConfig.gistId.trim()}?t=${Date.now()}`, { headers });
        if (!res.ok) {
          if (!silent) showToast(`동기화 실패: ${res.statusText}`);
          return;
        }
        const data = await res.json();
        const file = data.files[GIST_FILENAME] || Object.values(data.files).find(f => f.filename.endsWith('.json'));
        if (!file || !file.content) return;

        const remoteData = JSON.parse(file.content);
        if (remoteData.updatedAt > (appState.updatedAt || 0)) {
          appState = remoteData;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          renderAll();
          showToast('🔄 최신 데이터로 동기화되었습니다!');
        } else if (!silent) {
          showToast('이미 최신 상태입니다.');
        }
        syncConfig.lastSyncedAt = Date.now();
        renderHeader();
      } catch (err) {
        if (!silent) showToast('동기화 네트워크 오류가 발생했습니다.');
      }
    }

    async function pushToGist(notify = true) {
      if (!syncConfig.gistId || !syncConfig.githubToken) {
        if (notify) showToast('Gist ID와 GitHub Token이 설정되어 있어야 합니다.');
        return;
      }
      if (notify) showToast('GitHub에 저장 중...');
      try {
        appState.updatedAt = Date.now();
        const payload = {
          description: `[TripSync] ${appState.tripInfo.title}`,
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(appState, null, 2) }
          }
        };
        const res = await fetch(`https://api.github.com/gists/${syncConfig.gistId.trim()}`, {
          method: 'PATCH',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${syncConfig.githubToken.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          syncConfig.lastSyncedAt = Date.now();
          saveSyncConfig(syncConfig);
          if (notify) showToast('GitHub에 성공적으로 저장되었습니다!');
        } else {
          if (notify) showToast('GitHub 저장에 실패했습니다. 토큰 권한을 확인해주세요.');
        }
      } catch (e) {
        if (notify) showToast('네트워크 오류가 발생했습니다.');
      }
    }

    async function createNewGistRoom(token) {
      try {
        appState.updatedAt = Date.now();
        const payload = {
          description: `[TripSync] ${appState.tripInfo.title}`,
          public: false,
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(appState, null, 2) }
          }
        };
        const res = await fetch(`https://api.github.com/gists`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${token.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const resData = await res.json();
          syncConfig.gistId = resData.id;
          syncConfig.githubToken = token.trim();
          syncConfig.autoSync = true;
          syncConfig.lastSyncedAt = Date.now();
          saveSyncConfig(syncConfig);
          showToast(`새 방이 생성되었습니다! (ID: ${resData.id.slice(0, 8)}...)`);
          return resData.id;
        } else {
          showToast('Gist 생성 실패: 올바른 Personal Access Token인지 확인해주세요.');
          return null;
        }
      } catch (e) {
        showToast('Gist 생성 중 오류가 발생했습니다.');
        return null;
      }
    }

    function manualSync() {
      fetchFromGist(false);
    }

    function copyShareLink() {
      let shareUrl = window.location.origin + window.location.pathname;
      if (syncConfig.gistId) {
        shareUrl += `?gist=${encodeURIComponent(syncConfig.gistId)}`;

      navigator.clipboard.writeText(shareUrl);
      showToast('초대 링크가 클립보드에 복사되었습니다!');
    }

    // Auto-polling interval
    setInterval(() => {
      if (syncConfig.autoSync && syncConfig.gistId) {
        fetchFromGist(true);
      }
    }, Math.max(3, syncConfig.syncIntervalSec || 5) * 1000);

    function renderAll() {
      renderHeader();
      if (currentTab === 'schedule') renderScheduleView();
      else if (currentTab === 'plan') renderPlanView();
      else if (currentTab === 'expense') renderExpenseView();
      else if (currentTab === 'checklist') renderChecklistView();
    }

    /* =========================================================================
       6. ACTIONS & INTERACTIONS
       ========================================================================= */
    function setVoteFriend(fid) {
      selectedVoteFriendId = fid;
      renderScheduleView();
    }

    function voteDate(friendId, candidateId, status) {
      if (!appState.datePoll.votes[friendId]) appState.datePoll.votes[friendId] = {};
      appState.datePoll.votes[friendId][candidateId] = status;
      saveState();
      renderScheduleView();
    }

    function deleteCandidate(cid) {
      if (!confirm('후보 일정을 삭제하시겠습니까?')) return;
      appState.datePoll.candidates = appState.datePoll.candidates.filter(c => c.id !== cid);
      Object.keys(appState.datePoll.votes).forEach(fid => {
        delete appState.datePoll.votes[fid]?.[cid];
      });
      saveState();
      renderScheduleView();
    }

    function deleteFriend(fid) {
      if (!confirm('친구를 삭제하시겠습니까? 관련 지출 및 투표 내역에서도 제외됩니다.')) return;
      appState.friends = appState.friends.filter(f => f.id !== fid);
      saveState();
      renderAll();
    }

    function setSelectedDay(d) {
      selectedDay = d;
      renderPlanView();
    }

    function togglePlanCompleted(pid) {
      const p = appState.plans.find(item => item.id === pid);
      if (p) p.completed = !p.completed;
      saveState();
      renderPlanView();
    }

    function deletePlan(pid) {
      if (!confirm('일정을 삭제하시겠습니까?')) return;
      appState.plans = appState.plans.filter(p => p.id !== pid);
      saveState();
      renderPlanView();
    }

    function setExpenseFilter(f) {
      expenseFilter = f;
      renderExpenseView();
    }

    function toggleTransferDone(key) {
      completedTransfers[key] = !completedTransfers[key];
      renderExpenseView();
    }

    function copyAccountText(text) {
      navigator.clipboard.writeText(text);
      showToast('계좌/송금 정보가 복사되었습니다!');
    }

    function copyKakaoSummary() {
      const msg = formatKakaoMessage();
      navigator.clipboard.writeText(msg);
      showToast('카카오톡/단톡방 공유용 정산서가 복사되었습니다!');
      if (window.confetti) {
        window.confetti({ particleCount: 60, spread: 60, origin: { y: 0.8 } });
      }
    }

    function copyTransferList() {
      const s = calculateSettlement(appState.friends, appState.expenses);
      const text = s.transfers.map((t, i) => `${i + 1}. ${t.fromName} -> ${t.toName}: ${t.amount.toLocaleString()}원 (${t.toAccount || '계좌문의'})`).join('\n');
      navigator.clipboard.writeText(text);
      showToast('송금 리스트가 복사되었습니다!');
    }

    function deleteExpense(eid) {
      if (!confirm('지출 내역을 삭제하시겠습니까?')) return;
      appState.expenses = appState.expenses.filter(e => e.id !== eid);
      saveState();
      renderExpenseView();
    }

    function setChecklistFilter(f) {
      checklistFilter = f;
      renderChecklistView();
    }

    function handleQuickAddChecklist(e) {
      e.preventDefault();
      const input = document.getElementById('newCheckText');
      const type = document.getElementById('newCheckType');
      if (!input || !input.value.trim()) return;
      appState.checklists.push({
        id: `ch_${Date.now()}`,
        text: input.value.trim(),
        type: type.value,
        completed: false
      });
      input.value = '';
      saveState();
      renderChecklistView();
    }

      const item = appState.checklists.find(c => c.id === cid);
      if (item) item.completed = !item.completed;
      saveState();
      renderChecklistView();

                </div>
                <div class="flex gap-2">
                  <input type="text" id="m_s_gist" value="${syncConfig.gistId || ''}" placeholder="Gist ID 입력 또는 위 버튼으로 생성" class="flex-1 p-2.5 rounded-xl border border-outline-variant bg-surface text-xs font-mono" />
                  <button type="button" onclick="copyShareLink()" class="px-3 py-2 rounded-xl bg-surface-container text-on-surface text-xs font-bold shrink-0">초대링크</button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="pushToGist(true)" class="py-2.5 rounded-xl bg-primary-fixed text-primary text-xs font-bold flex items-center justify-center gap-1 hover:bg-primary-fixed-dim">
                  <span class="material-symbols-outlined text-[16px]">upload</span> GitHub에 저장 (Push)
                </button>
                <button onclick="fetchFromGist(false)" class="py-2.5 rounded-xl bg-surface-container text-on-surface text-xs font-bold flex items-center justify-center gap-1 hover:bg-surface-container-high">
                  <span class="material-symbols-outlined text-[16px]">download</span> 최신 가져오기 (Pull)
                </button>
              </div>

              <!-- Backup & Restore -->
              <div class="pt-2 border-t border-surface-container-high space-y-2">
                <span class="text-xs font-bold block">오프라인 백업 및 복원</span>
                <div class="grid grid-cols-2 gap-2">
                  <button type="button" onclick="exportDataJson()" class="py-2 rounded-xl bg-surface-container text-xs font-semibold">JSON 파일 다운로드</button>
                  <label class="py-2 rounded-xl bg-surface-container text-xs font-semibold text-center cursor-pointer">
                    JSON 파일 복원
                    <input type="file" accept=".json" onchange="importDataJson(event)" class="hidden" />
                  </label>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-surface-container-high">
                <button type="button" onclick="resetToSample()" class="text-xs text-on-surface-variant hover:text-primary">샘플 데이터로 초기화</button>
                <button type="button" onclick="handleSaveSyncModal()" class="px-5 py-2.5 rounded-xl bg-primary text-on-primary text-xs font-bold">설정 저장</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function handleSaveTripInfo(e) {
      e.preventDefault();
      appState.tripInfo.coverEmoji = document.getElementById('m_emoji').value.trim() || '✈️';
      appState.tripInfo.title = document.getElementById('m_title').value.trim() || '우리들의 여행';
      appState.tripInfo.destination = document.getElementById('m_dest').value.trim() || '여행지';
      appState.tripInfo.startDate = document.getElementById('m_start').value;
      appState.tripInfo.endDate = document.getElementById('m_end').value;
      appState.tripInfo.memo = document.getElementById('m_memo').value.trim();
      saveState();
      closeModal();
      renderAll();
      showToast('여행 정보가 수정되었습니다.');
    }

    function handleSaveCandidate(e) {
      e.preventDefault();
      const date = document.getElementById('m_cand_date').value.trim();
      const notes = document.getElementById('m_cand_notes').value.trim();
      if (!date) return;
      appState.datePoll.candidates.push({
        id: `c_${Date.now()}`,
        dateStr: date,
        notes: notes || undefined
      });
      saveState();
      closeModal();
      renderScheduleView();
      showToast('후보 날짜가 추가되었습니다.');
    }

    function handleSaveFriend(e, editId) {
      e.preventDefault();
      const name = document.getElementById('m_f_name').value.trim();
      const color = document.getElementById('m_f_color').value;
      const acc = document.getElementById('m_f_acc').value.trim();
      if (!name) return;

      if (editId) {
        const f = appState.friends.find(item => item.id === editId);
        if (f) {
          f.name = name;
          f.color = color;
          f.accountInfo = acc;
        }
      } else {
        appState.friends.push({
          id: `f_${Date.now()}`,
          name,
          color,
          accountInfo: acc
        });
      }
      saveState();
      closeModal();
      renderAll();
      showToast(editId ? '친구 정보가 수정되었습니다.' : '새 친구가 추가되었습니다.');
    }

    function editFriend(fid) {
      openModal('editFriendModal', fid);
    }

    function handleSavePlan(e, editId) {
      e.preventDefault();
      const day = Number(document.getElementById('m_p_day').value);
      const time = document.getElementById('m_p_time').value;
      const title = document.getElementById('m_p_title').value.trim();
      const cat = document.getElementById('m_p_cat').value;
      const cost = parseInt(document.getElementById('m_p_cost').value, 10) || 0;
      const loc = document.getElementById('m_p_loc').value.trim();
      const memo = document.getElementById('m_p_memo').value.trim();

      const payload = {
        day,
        time,
        title,
        category: cat,
        costEstimate: cost,
        location: loc,
        placeUrl: loc ? `https://map.kakao.com/link/search/${encodeURIComponent(loc)}` : undefined,
        memo,
        completed: false
      };

      if (editId) {
        const p = appState.plans.find(item => item.id === editId);
        if (p) Object.assign(p, payload);
      } else {
        appState.plans.push({ id: `p_${Date.now()}`, ...payload });
      }
      saveState();
      closeModal();
      renderPlanView();
      showToast(editId ? '일정이 수정되었습니다.' : '새 일정이 등록되었습니다.');
    }

    function editPlan(pid) {
      openModal('planModal', pid);
    }

    function handleSaveExpense(e, editId) {
      e.preventDefault();
      const title = document.getElementById('m_e_title').value.trim();
      const amount = parseInt(document.getElementById('m_e_amount').value, 10) || 0;
      const payerId = document.getElementById('m_e_payer').value;
      const category = document.getElementById('m_e_cat').value;
      const date = document.getElementById('m_e_date').value;
      const location = document.getElementById('m_e_loc').value.trim();
      const memo = document.getElementById('m_e_memo').value.trim();

      const checkedParts = Array.from(document.querySelectorAll("input[name='m_e_part']:checked")).map(el => el.value);
      if (checkedParts.length === 0) {
        alert('분할 대상을 최소 1명 이상 선택해주세요.');
        return;
      }

      const payload = {
        title,
        amount,
        payerId,
        category,
        date,
        location,
        memo,
        participantIds: checkedParts
      };

      if (editId) {
        const exp = appState.expenses.find(item => item.id === editId);
        if (exp) Object.assign(exp, payload);
      } else {
        appState.expenses.unshift({ id: `e_${Date.now()}`, createdAt: Date.now(), ...payload });
      }
      saveState();
      closeModal();
      renderExpenseView();
      showToast(editId ? '지출 내역이 수정되었습니다.' : '새 지출이 등록되었습니다.');
    }

    function editExpense(eid) {
      openModal('expenseModal', eid);
    }

    async function handleAutoCreateGist() {
      const token = document.getElementById('m_s_token').value.trim();
      if (!token) {
        alert('토큰을 먼저 입력해주세요.');
        return;
      }
      const newId = await createNewGistRoom(token);
      if (newId) {
        const input = document.getElementById('m_s_gist');
        if (input) input.value = newId;
      }
    }

    function handleSaveSyncModal() {
      const token = document.getElementById('m_s_token').value.trim();
      const gist = document.getElementById('m_s_gist').value.trim();
      syncConfig.githubToken = token;
      syncConfig.gistId = gist;
      saveSyncConfig(syncConfig);
      closeModal();
      showToast('동기화 설정이 저장되었습니다.');
    }

    function exportDataJson() {
      const json = JSON.stringify(appState, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `TripSync_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDataJson(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.tripInfo && parsed.friends) {
            appState = parsed;
            saveState();
            closeModal();
            renderAll();
            showToast('데이터가 성공적으로 복원되었습니다!');
          } else {
            alert('올바른 TripSync 데이터 파일이 아닙니다.');
          }
        } catch {
          alert('JSON 파일 파싱 실패');
        }
      };
      reader.readAsText(file);
    }

    function resetToSample() {
      if (!confirm('샘플 데이터로 초기화하시겠습니까?')) return;
      appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveState();
      closeModal();
      renderAll();
      showToast('샘플 데이터가 복원되었습니다.');
    }

    /* =========================================================================
       8. INITIALIZATION
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      // If Gist in URL, auto fetch
      const urlParams = new URLSearchParams(window.location.search);
      const urlGist = urlParams.get('gist');
      if (urlGist) {
        fetchFromGist(true);
      }
    });
  </script>
</body>

</html>
