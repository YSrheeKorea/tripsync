    /* =========================================================================
       2. SETTLEMENT & MIN CASH FLOW ALGORITHM (N빵 최소 송금)
       ========================================================================= */
    function calculateSettlement(friends, expenses) {
      const friendMap = new Map(friends.map(f => [f.id, f]));
      const paidMap = {};
      const owedMap = {};
      friends.forEach(f => { paidMap[f.id] = 0; owedMap[f.id] = 0; });

      let totalExpenses = 0;

      expenses.forEach(exp => {
        const amount = Math.round(exp.amount) || 0;
        if (amount <= 0) return;
        totalExpenses += amount;

        paidMap[exp.payerId] = (paidMap[exp.payerId] || 0) + amount;

        const participants = exp.participantIds && exp.participantIds.length > 0
          ? exp.participantIds.filter(id => friendMap.has(id))
          : friends.map(f => f.id);

        if (participants.length === 0) return;

        // 5번: 차등 정산(customSplits) 지원 + 균등 N빵 기본값
        if (exp.splitType === 'custom' && exp.customSplits && typeof exp.customSplits === 'object') {
          let assignedSum = 0;
          participants.forEach(pid => {
            const customVal = Math.round(Number(exp.customSplits[pid]) || 0);
            owedMap[pid] = (owedMap[pid] || 0) + customVal;
            assignedSum += customVal;
          });
          // 단수 차이(환율 반올림 등) 보정
          const diff = amount - assignedSum;
          if (diff !== 0 && participants.length > 0) {
            owedMap[participants[0]] = (owedMap[participants[0]] || 0) + diff;
          }
        } else {
          const baseShare = Math.floor(amount / participants.length);
          const remainder = amount % participants.length;

          participants.forEach((pid, idx) => {
            const share = baseShare + (idx < remainder ? 1 : 0);
            owedMap[pid] = (owedMap[pid] || 0) + share;
          });
        }
      });

      const balances = friends.map(f => ({
        id: f.id,
        net: (paidMap[f.id] || 0) - (owedMap[f.id] || 0)
      }));

      // Min Cash Flow Greedy Algorithm
      const transfers = [];
      const working = balances.map(b => ({ ...b }));

      while (true) {
        let maxCreditor = working[0];
        let maxDebtor = working[0];

        for (const b of working) {
          if (b.net > maxCreditor.net) maxCreditor = b;
          if (b.net < maxDebtor.net) maxDebtor = b;
        }

        if (Math.abs(maxCreditor.net) <= 0.01 && Math.abs(maxDebtor.net) <= 0.01) break;

        const transferAmount = Math.min(maxCreditor.net, -maxDebtor.net);
        if (transferAmount <= 0) break;

        const fromFriend = friendMap.get(maxDebtor.id);
        const toFriend = friendMap.get(maxCreditor.id);

        if (fromFriend && toFriend) {
          transfers.push({
            fromId: fromFriend.id,
            fromName: fromFriend.name,
            toId: toFriend.id,
            toName: toFriend.name,
            toAccount: toFriend.accountInfo,
            amount: Math.round(transferAmount)
          });
        }

        maxCreditor.net -= transferAmount;
        maxDebtor.net += transferAmount;
      }

      const friendSummaries = friends.map(f => ({
        friend: f,
        totalPaid: paidMap[f.id] || 0,
        totalOwed: owedMap[f.id] || 0,
        netBalance: (paidMap[f.id] || 0) - (owedMap[f.id] || 0)
      }));

      // 외화 지출 집계
      const currencyTotals = {};
      expenses.forEach(exp => {
        const curr = exp.currency || 'KRW';
        if (curr !== 'KRW' && typeof exp.foreignAmount === 'number' && exp.foreignAmount > 0) {
          currencyTotals[curr] = (currencyTotals[curr] || 0) + exp.foreignAmount;
        }
      });

      return {
        totalExpenses,
        expenseCount: expenses.length,
        transfers,
        friendSummaries,
        currencyTotals
      };
    }

      text += `─────────────────────\n`;
      text += `확인 후 송금 부탁드립니다! 🎒`;

    function calculateDDay() {
      try {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const start = new Date(appState.tripInfo.startDate);
        start.setHours(0, 0, 0, 0);
        const diff = Math.ceil((start.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day';
        if (diff > 0) return `D-${diff}`;
        return `D+${Math.abs(diff)}`;
      } catch {
        return 'D-Day';
      }
    }

    function calculateTotalDays() {
      try {
        const s = new Date(appState.tripInfo.startDate);
        const e = new Date(appState.tripInfo.endDate);
        const diff = Math.ceil((e.getTime() - s.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        return isNaN(diff) || diff < 1 ? 3 : diff;
      } catch {
        return 3;
      }
    }

    function mergeCollectionById(localArr = [], remoteArr = [], deletedIds = {}, sortByCreatedDesc = false) {
      const localMap = new Map();
      const remoteMap = new Map();
      const order = [];

      localArr.forEach(item => {
        if (item && item.id) {
          localMap.set(item.id, item);
          order.push(item.id);
        }
      });
      remoteArr.forEach(item => {
        if (item && item.id) {
          remoteMap.set(item.id, item);
          if (!localMap.has(item.id)) order.push(item.id);
        }
      });

      const merged = [];
      order.forEach(id => {
        const lItem = localMap.get(id);
        const rItem = remoteMap.get(id);
        const delTs = deletedIds[id] || 0;
        const lTs = lItem ? (lItem._updatedAt || lItem.createdAt || 0) : 0;
        const rTs = rItem ? (rItem._updatedAt || rItem.createdAt || 0) : 0;

        // 삭제 기록이 항목 수정 시각보다 최신이면 삭제 유지
        if (delTs > Math.max(lTs, rTs)) return;

        if (lItem && rItem) {
          merged.push(rTs > lTs ? rItem : lItem);
        } else if (lItem) {
          merged.push(lItem);
        } else if (rItem) {
          merged.push(rItem);
        }
      });

      if (sortByCreatedDesc) {
        merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }
      return merged;
    }

    function smartMergeTripStates(local, remote) {
      if (!remote || !remote.tripInfo) return local;
      if (!local || !local.tripInfo) return remote;

      // 1. 삭제 기록(Tombstone) 병합
      const deletedIds = { ...(remote.deletedIds || {}), ...(local.deletedIds || {}) };
      Object.keys(deletedIds).forEach(k => {
        deletedIds[k] = Math.max(local.deletedIds?.[k] || 0, remote.deletedIds?.[k] || 0);
      });

      // 2. 여행 기본 정보 병합
      const lInfoTs = local.tripInfo._updatedAt || local.updatedAt || 0;
      const rInfoTs = remote.tripInfo._updatedAt || remote.updatedAt || 0;
      const tripInfo = rInfoTs > lInfoTs ? { ...remote.tripInfo } : { ...local.tripInfo };

      // 3. 항목별(ID 단위) 자동 병합 — 1초 차이 동시 추가/수정 모두 보존
      const friends = mergeCollectionById(local.friends, remote.friends, deletedIds, false);
      const plans = mergeCollectionById(local.plans, remote.plans, deletedIds, false);
      const expenses = mergeCollectionById(local.expenses, remote.expenses, deletedIds, true);
      const checklists = mergeCollectionById(local.checklists, remote.checklists, deletedIds, false);

      // 4. 일정 조율 후보 및 멤버별 투표 병합
      const candidates = mergeCollectionById(
        local.datePoll?.candidates,
        remote.datePoll?.candidates,
        deletedIds,
        false
      );
      const validCandIds = new Set(candidates.map(c => c.id));
      const voteMeta = { ...(remote.datePoll?.voteMeta || {}), ...(local.datePoll?.voteMeta || {}) };
      const votes = {};
      const allFriendIds = new Set([
        ...Object.keys(local.datePoll?.votes || {}),
        ...Object.keys(remote.datePoll?.votes || {})
      ]);
      allFriendIds.forEach(fid => {
        if (deletedIds[fid]) return;
        votes[fid] = {};
        const lVotes = local.datePoll?.votes?.[fid] || {};
        const rVotes = remote.datePoll?.votes?.[fid] || {};
        const candKeys = new Set([...Object.keys(lVotes), ...Object.keys(rVotes)]);
        candKeys.forEach(cid => {
          if (!validCandIds.has(cid)) return;
          const mk = `${fid}:${cid}`;
          const lvt = local.datePoll?.voteMeta?.[mk] || 0;
          const rvt = remote.datePoll?.voteMeta?.[mk] || 0;
          if (lVotes[cid] !== undefined && rVotes[cid] !== undefined) {
            votes[fid][cid] = rvt > lvt ? rVotes[cid] : lVotes[cid];
            voteMeta[mk] = Math.max(lvt, rvt);
          } else if (lVotes[cid] !== undefined) {
            votes[fid][cid] = lVotes[cid];
          } else {
            votes[fid][cid] = rVotes[cid];
          }
        });
      });

      return {
        version: Math.max(local.version || 1, remote.version || 1),
        updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0, Date.now()),
        deletedIds,
        tripInfo,
        friends,
        datePoll: { candidates, votes, voteMeta },
        plans,
        expenses,
        checklists
      };
    }

    // 2. GitHub Gist 동기화 (동시 수정 자동 병합 Smart Merge 지원)
    function debouncePush() {
      hasUnsyncedLocalChanges = true;
      if (pushTimeout) clearTimeout(pushTimeout);
      pushTimeout = setTimeout(() => {
        pushToGist(false);
      }, 1000);
    }

    async function fetchRemoteGistData() {
      const headers = { 'Accept': 'application/vnd.github.v3+json' };
      if (syncConfig.githubToken) headers['Authorization'] = `token ${syncConfig.githubToken.trim()}`;
      const res = await fetch(`https://api.github.com/gists/${syncConfig.gistId.trim()}?t=${Date.now()}`, { headers });
      if (!res.ok) return { ok: false, statusText: res.statusText, data: null };
      const data = await res.json();
      const file = data.files[GIST_FILENAME] || Object.values(data.files).find(f => f.filename.endsWith('.json'));
      if (!file || !file.content) return { ok: true, data: null };
      return { ok: true, data: JSON.parse(file.content) };
    }

    async function fetchFromGist(silent = false) {
      if (!syncConfig.gistId || isPushingGist) return;
      if (!silent) showToast('채팅방에서 최신 데이터를 가져오는 중...');
      try {
        const result = await fetchRemoteGistData();
        if (!result.ok) {
          if (!silent) showToast(`동기화 실패: ${result.statusText}`);
          return;
        }
        const remoteData = result.data;
        if (!remoteData) return;

        if ((remoteData.updatedAt || 0) > (appState.updatedAt || 0)) {
          appState = hasUnsyncedLocalChanges
            ? smartMergeTripStates(appState, remoteData)
            : remoteData;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          renderAll();
          showToast('🔄 최신 데이터로 동기화되었습니다!');
        } else if (!silent) {
          showToast('이미 최신 상태입니다.');
        }
        syncConfig.lastSyncedAt = Date.now();
        renderHeader();
      } catch (err) {
        if (!silent) showToast('동기화 네트워크 오류가 발생했습니다.');
      }
    }

    async function pushToGist(notify = true) {
      if (!syncConfig.gistId || !syncConfig.githubToken) {
        if (notify) showToast('채팅방 가입 아이디와 비밀번호를 먼저 입력해주세요.');
        return;
      }
      if (isPushingGist) {
        debouncePush();
        return;
      }
      isPushingGist = true;
      if (notify) showToast('최신 내역 병합 후 채팅방에 저장 중...');
      try {
        // 저장 직전 최신본을 먼저 조회해 동시 수정 내용을 항목 단위로 자동 병합
        let mergedRemote = false;
        try {
          const latest = await fetchRemoteGistData();
          if (latest.ok && latest.data && (latest.data.updatedAt || 0) > (syncConfig.lastSyncedAt || 0)) {
            appState = smartMergeTripStates(appState, latest.data);
            mergedRemote = true;
          }
        } catch (e) {
          // 사전 조회 실패 시 현재 로컬 상태로 저장 진행
        }

        appState.updatedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

        const payload = {
          description: `[TripSync] ${appState.tripInfo.title}`,
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(appState, null, 2) }
          }
        };
        const res = await fetch(`https://api.github.com/gists/${syncConfig.gistId.trim()}`, {
          method: 'PATCH',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${syncConfig.githubToken.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          hasUnsyncedLocalChanges = false;
          syncConfig.lastSyncedAt = appState.updatedAt;
          saveSyncConfig(syncConfig);
          if (mergedRemote) {
            renderAll();
            showToast('🤝 다른 친구의 수정 내용과 자동 병합되어 저장되었습니다!');
          } else if (notify) {
            showToast('채팅방에 성공적으로 저장되었습니다!');
          }
        } else {
          if (notify) showToast('채팅방 저장에 실패했습니다. 비밀번호를 확인해주세요.');
        }
      } catch (e) {
        if (notify) showToast('네트워크 오류가 발생했습니다.');
      } finally {
        isPushingGist = false;
      }
    }

    async function createNewGistRoom(token) {
      try {
        appState.updatedAt = Date.now();
        const payload = {
          description: `[TripSync] ${appState.tripInfo.title}`,
          public: false,
          files: {
            [GIST_FILENAME]: { content: JSON.stringify(appState, null, 2) }
          }
        };
        const res = await fetch(`https://api.github.com/gists`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${token.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const resData = await res.json();
          syncConfig.gistId = resData.id;
          syncConfig.githubToken = token.trim();
          syncConfig.autoSync = true;
          syncConfig.lastSyncedAt = Date.now();
          saveSyncConfig(syncConfig);
          showToast(`새 채팅방이 생성되었습니다! (아이디: ${resData.id.slice(0, 8)}...)`);
          return resData.id;
        } else {
          showToast('채팅방 생성 실패: 올바른 비밀번호인지 확인해주세요.');
          return null;
        }
      } catch (e) {
        showToast('채팅방 생성 중 오류가 발생했습니다.');
        return null;
      }
    }

    function getShareUrl() {
      let baseHref = window.location.href;
      // localhost로 열었을 때 스마트폰 QR 스캔이 가능하도록 PC의 실제 LAN IP로 자동 치환
      if ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && serverInfo.url) {
        baseHref = serverInfo.url + window.location.pathname;
      }
      const url = new URL(baseHref);
      url.search = '';
      url.hash = '';
      if (syncConfig.gistId) {
        url.searchParams.set('gist', syncConfig.gistId);
        // 원클릭 편집 초대 옵션 활성화 시 비밀번호를 URL 해시(#pw=...)로 포함
        if (syncConfig.includePwInShare !== false && syncConfig.githubToken) {
          url.hash = `pw=${encodeURIComponent(btoa(syncConfig.githubToken.trim()))}`;
        }
      } else if (syncConfig.roomCode) {
        url.searchParams.set('room', syncConfig.roomCode);
      }
      return url.toString();
    }

    function toggleIncludePwInShare(checked) {
      syncConfig.includePwInShare = Boolean(checked);
      saveSyncConfig(syncConfig);
      renderModalQRCode();
      showToast(syncConfig.includePwInShare
        ? '🔓 이제 링크/QR로 들어온 친구도 즉시 공동 편집이 가능합니다!'
        : '🔒 읽기 전용 초대 링크/QR로 전환되었습니다.');
    }

    function encodeTripSnapshot(data) {
      const jsonStr = JSON.stringify(data);
      const bytes = new TextEncoder().encode(jsonStr);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return 'TS1:' + btoa(binary);
    }

    function decodeTripSnapshot(codeStr) {
      const trimmed = codeStr.trim();
      const raw = trimmed.startsWith('TS1:') ? trimmed.slice(4) : trimmed;
      const binary = atob(raw);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const jsonStr = new TextDecoder().decode(bytes);
      return JSON.parse(jsonStr);
    }

    function copyTripSnapshotCode() {
      try {
        const snapshot = encodeTripSnapshot(appState);
        navigator.clipboard.writeText(snapshot);
        showToast('📋 여행 데이터 스냅샷 코드가 복사되었습니다! 카톡으로 보내보세요.');
      } catch (e) {
        showToast('스냅샷 코드 생성 중 오류가 발생했습니다.');
      }
    }

    function importTripSnapshotCode() {
      const input = prompt('친구에게 받은 여행 스냅샷 코드(TS1:...)를 붙여넣어주세요:');
      if (!input || !input.trim()) return;
      try {
        const parsed = decodeTripSnapshot(input);
        if (parsed && parsed.tripInfo && Array.isArray(parsed.friends)) {
          appState = parsed;
          saveState();
          closeModal();
          renderAll();
          showToast('🎉 스냅샷 코드로 여행 데이터를 불러왔습니다!');
        } else {
          alert('올바른 TripSync 스냅샷 코드가 아닙니다.');
        }
      } catch (e) {
        alert('코드 해석에 실패했습니다. 전체 코드가 정확히 복사되었는지 확인해주세요.');
      }
    }

    /* =========================================================================
       4-B. AI ROUTE OPTIMIZER (최단 이동 동선 자동 계산 - Haversine + 2-opt)
       ========================================================================= */
    let lastRouteUndoSnapshot = null;

    function haversineKm(lat1, lng1, lat2, lng2) {
      const toRad = d => (d * Math.PI) / 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateRouteDistanceKm(orderedPlans) {
      let total = 0;
      for (let i = 0; i < orderedPlans.length - 1; i++) {
        total += haversineKm(
          orderedPlans[i].lat, orderedPlans[i].lng,
          orderedPlans[i + 1].lat, orderedPlans[i + 1].lng
        );
      }
      return total;
    }

    function optimizeDayRoute(day) {
      const dayPlans = appState.plans
        .filter(p => p.day === day)
        .sort((a, b) => a.time.localeCompare(b.time));
      const withCoords = dayPlans.filter(p => typeof p.lat === 'number' && typeof p.lng === 'number' && !isNaN(p.lat) && !isNaN(p.lng));

      if (withCoords.length < 3) {
        showToast('좌표가 등록된 일정이 3곳 이상일 때 동선 최적화가 가능합니다.');
        return;
      }

      const beforeKm = calculateRouteDistanceKm(withCoords);

      // 되돌리기용 스냅샷 저장
      lastRouteUndoSnapshot = {
        day,
        times: withCoords.map(p => ({ id: p.id, time: p.time }))
      };

      // 1단계: 첫 번째 일정(출발지)을 고정하고 Nearest-Neighbor 탐색
      const remaining = withCoords.slice(1);
      const route = [withCoords[0]];
      while (remaining.length > 0) {
        const last = route[route.length - 1];
        let bestIdx = 0;
        let bestDist = Infinity;
        remaining.forEach((cand, idx) => {
          const d = haversineKm(last.lat, last.lng, cand.lat, cand.lng);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = idx;
          }
        });
        route.push(remaining.splice(bestIdx, 1)[0]);
      }

      // 2단계: 2-opt 교차 경로 제거로 최단 동선 정밀 최적화
      let improved = true;
      let guard = 0;
      while (improved && guard < 40) {
        improved = false;
        guard++;
        for (let i = 1; i < route.length - 1; i++) {
          for (let j = i + 1; j < route.length; j++) {
            const candidate = [
              ...route.slice(0, i),
              ...route.slice(i, j + 1).reverse(),
              ...route.slice(j + 1)
            ];
            if (calculateRouteDistanceKm(candidate) + 0.001 < calculateRouteDistanceKm(route)) {
              route.splice(0, route.length, ...candidate);
              improved = true;
            }
          }
        }
      }

      const afterKm = calculateRouteDistanceKm(route);
      if (beforeKm - afterKm < 0.05) {
        lastRouteUndoSnapshot = null;
        showToast(`✅ Day ${day} 일정은 이미 최단 동선입니다! (총 ${beforeKm.toFixed(1)}km)`);
        return;
      }

      // 기존 시간 슬롯을 최적화된 순서대로 재배치
      const sortedTimes = withCoords.map(p => p.time).sort((a, b) => a.localeCompare(b));
      const now = Date.now();
      route.forEach((plan, idx) => {
        plan.time = sortedTimes[idx];
        plan._updatedAt = now;
      });

      saveState();
      renderPlanView();
      const savedKm = (beforeKm - afterKm).toFixed(1);
      showToast(`✨ 최단 동선 최적화 완료! ${beforeKm.toFixed(1)}km → ${afterKm.toFixed(1)}km (${savedKm}km 단축)`);
    }

    function undoRouteOptimization() {
      if (!lastRouteUndoSnapshot) return;
      const now = Date.now();
      lastRouteUndoSnapshot.times.forEach(({ id, time }) => {
        const p = appState.plans.find(item => item.id === id);
        if (p) {
          p.time = time;
          p._updatedAt = now;
        }
      });
      lastRouteUndoSnapshot = null;
      saveState();
      renderPlanView();
      showToast('↩️ 이전 일정 순서로 되돌렸습니다.');
    }

      else if (avg >= 9) outfit = '🧥 트렌치코트·자켓·니트 레이어드 추천';
      else outfit = '🧣 두꺼운 코트·패딩·방한용품 필수';

      if (rainProb >= 50 || rainyCode) {
        return `☔ 비 예보(${rainProb}%) — 휴대용 우산을 챙기고 실내 일정(쇼핑몰·맛집) 위주로 동선을 조정하세요! · ${outfit}`;
      }
      if (rainProb >= 30) {
        return `🌂 구름 많음(강수확률 ${rainProb}%) — 작은 접이식 우산 하나 챙기면 안심! · ${outfit}`;
      }
      return `✨ 야외 활동하기 좋은 날씨(강수확률 ${rainProb}%) · ${outfit}`;
    }

    async function fetchDestinationWeather(force = false) {
      const coords = resolveTripWeatherCoords();
      const cacheKey = `${coords.lat.toFixed(2)}_${coords.lng.toFixed(2)}_${appState.tripInfo.startDate}`;
      if (!force && (weatherCache.key === cacheKey || weatherCache.loading)) return;

      weatherCache.loading = true;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=14&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API failed');
        const data = await res.json();
        const d = data.daily;
        if (!d || !Array.isArray(d.time)) throw new Error('Invalid weather payload');

        const allDays = d.time.map((dateStr, i) => ({
          date: dateStr,
          code: d.weathercode?.[i] ?? 1,
          max: Math.round(d.temperature_2m_max?.[i] ?? 22),
          min: Math.round(d.temperature_2m_min?.[i] ?? 15),
          rainProb: Math.round(d.precipitation_probability_max?.[i] ?? 10)
        }));

        const totalDays = Math.min(7, Math.max(3, calculateTotalDays()));
        const startIdx = allDays.findIndex(item => item.date === appState.tripInfo.startDate);
        let picked = [];
        let isExact = false;
        if (startIdx >= 0) {
          picked = allDays.slice(startIdx, startIdx + totalDays);
          isExact = true;
        }
        if (picked.length < totalDays) {
          picked = allDays.slice(0, totalDays);
          isExact = false;
        }

        weatherCache = {
          key: cacheKey,
          days: picked,
          isExactTripDates: isExact,
          cityLabel: coords.label,
          loading: false
        };
        if (currentTab === 'plan') {
          const box = document.getElementById('planWeatherWidget');
          if (box) box.innerHTML = buildWeatherWidgetInnerHtml();
        }
      } catch (e) {
        weatherCache.loading = false;
      }
    }

        const dt = new Date(y, m - 1, d + (dayNum - 1));
        const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
        return `${dt.getMonth() + 1}/${dt.getDate()}(${weekdays[dt.getDay()]})`;

        return '';

    function openSwapDaysModal() {
      const totalDays = Math.max(3, calculateTotalDays());
      const otherDay = selectedDay < totalDays ? selectedDay + 1 : 1;
      const input = prompt(`Day ${selectedDay} 일정 전체를 몇 일차(Day 1 ~ Day ${totalDays})와 맞바꿀까요?\n(숫자만 입력, 예: ${otherDay})`, String(otherDay));
      if (!input) return;
      const targetDay = parseInt(input.trim(), 10);
      if (isNaN(targetDay) || targetDay < 1 || targetDay > totalDays || targetDay === selectedDay) {
        alert(`1 ~ ${totalDays} 사이의 다른 일차 숫자를 입력해주세요.`);
        return;
      }
      const now = Date.now();
      let swappedCount = 0;
      appState.plans.forEach(p => {
        if (p.day === selectedDay) {
          p.day = targetDay;
          p._updatedAt = now;
          swappedCount++;
        } else if (p.day === targetDay) {
          p.day = selectedDay;
          p._updatedAt = now;
          swappedCount++;
        }
      });
      selectedDay = targetDay;
      saveState();
      renderPlanView();
      showToast(`⇄ 일차 변경 완료! (총 ${swappedCount}개 일정 이동됨)`);

    function voteDate(friendId, candidateId, status) {
      if (!appState.datePoll.votes[friendId]) appState.datePoll.votes[friendId] = {};
      if (!appState.datePoll.voteMeta) appState.datePoll.voteMeta = {};
      appState.datePoll.votes[friendId][candidateId] = status;
      appState.datePoll.voteMeta[`${friendId}:${candidateId}`] = Date.now();
      saveState();
      renderScheduleView();
    }

    function confirmCandidateDate(cid) {
      const cand = appState.datePoll.candidates.find(c => c.id === cid);
      if (!cand) return;
      const str = cand.dateStr || '';
      const curYear = (appState.tripInfo.startDate || new Date().toISOString()).slice(0, 4);

      // "2026-07-15 ~ 07-18" 또는 "2026.07.15 ~ 2026.07.18" 또는 "7/15 ~ 7/18" 파싱
      const fullMatches = [...str.matchAll(/(?:(20\d{2})[-./])?(\d{1,2})[-./](\d{1,2})/g)];
      if (fullMatches.length >= 1) {
        const y1 = fullMatches[0][1] || curYear;
        const m1 = fullMatches[0][2].padStart(2, '0');
        const d1 = fullMatches[0][3].padStart(2, '0');
        const startStr = `${y1}-${m1}-${d1}`;
        let endStr = startStr;
        if (fullMatches.length >= 2) {
          const y2 = fullMatches[1][1] || y1;
          const m2 = fullMatches[1][2].padStart(2, '0');
          const d2 = fullMatches[1][3].padStart(2, '0');
          endStr = `${y2}-${m2}-${d2}`;
        }
        appState.tripInfo.startDate = startStr;
        appState.tripInfo.endDate = endStr;
        appState.tripInfo._updatedAt = Date.now();
        saveState();
        renderAll();
        showToast(`📅 여행 일정이 [${startStr} ~ ${endStr}]로 확정되었습니다!`);
      } else {
        openModal('tripEditModal');
        showToast('날짜 형식을 직접 선택해 확정해주세요.');
      }
    }

      if (!confirm('후보 일정을 삭제하시겠습니까?')) return;
      markItemDeleted(cid);
      appState.datePoll.candidates = appState.datePoll.candidates.filter(c => c.id !== cid);
      Object.keys(appState.datePoll.votes).forEach(fid => {

    function setPlanRating(planId, rating) {
      const p = appState.plans.find(item => item.id === planId);
      if (!p) return;
      p.rating = p.rating === rating ? 0 : rating;
      p._updatedAt = Date.now();
      saveState();
      renderPlanView();
      if (p.rating > 0) showToast(`⭐ '${p.title}'에 ${p.rating}점을 남겼습니다!`);
    }

    function compressImageFileToDataUrl(file, maxDim = 560, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('파일 읽기 실패'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('이미지 로드 실패'));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePlanPhotoUpload(event, planId) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const dataUrl = await compressImageFileToDataUrl(file, 560, 0.72);
        const p = appState.plans.find(item => item.id === planId);
        if (p) {
          p.photoDataUrl = dataUrl;
          if (!p.rating) p.rating = 5;
          p._updatedAt = Date.now();
          saveState();
          renderPlanView();
          showToast('📸 여행 인증샷이 등록되었습니다!');
        }
      } catch (e) {
        showToast('사진 압축 및 등록 중 오류가 발생했습니다.');
      } finally {
        event.target.value = '';
      }
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    async function drawTripSummaryCanvas() {
      const canvas = document.getElementById('tripSummaryCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const settlement = calculateSettlement(appState.friends, appState.expenses);
      const perPerson = appState.friends.length > 0 ? Math.round(settlement.totalExpenses / appState.friends.length) : 0;

      // 1. 배경 그라데이션
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, '#004b73');
      bgGrad.addColorStop(0.35, '#006194');
      bgGrad.addColorStop(1, '#003654');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 장식 원형 빛 효과
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.arc(W - 80, 90, 180, 0, Math.PI * 2);
      ctx.fill();

      // 2. 헤더 영역
      ctx.fillStyle = '#93ccff';
      ctx.font = 'bold 20px "Noto Sans KR", sans-serif';
      ctx.fillText(`✈️ TRIP SYNC SUMMARY  |  ${appState.tripInfo.destination}`, 48, 62);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 42px "Noto Sans KR", sans-serif';
      ctx.fillText(`${appState.tripInfo.coverEmoji || '✈️'} ${appState.tripInfo.title}`, 48, 118);

      ctx.fillStyle = '#d2e4ff';
      ctx.font = '600 21px "Noto Sans KR", sans-serif';
      const membersStr = appState.friends.map(f => f.name).join(' · ');
      ctx.fillText(`📅 ${appState.tripInfo.startDate} ~ ${appState.tripInfo.endDate}   |   👥 ${membersStr} (${appState.friends.length}명)`, 48, 158);

      // 3. 메인 화이트 카드 영역
      drawRoundedRect(ctx, 36, 190, W - 72, H - 246, 28);
      ctx.fillStyle = '#faf8ff';
      ctx.fill();

      let curY = 238;

      // 4. 인증샷 포토 스트립 (사진이 있는 경우 최대 3장 렌더링)
      const photoPlans = appState.plans.filter(p => p.photoDataUrl).slice(0, 3);
      if (photoPlans.length > 0) {
        ctx.fillStyle = '#006194';
        ctx.font = 'bold 20px "Noto Sans KR", sans-serif';
        ctx.fillText('📸 베스트 포토 모먼트', 68, curY);
        curY += 16;

        const gap = 14;
        const boxW = Math.floor((W - 136 - gap * (photoPlans.length - 1)) / photoPlans.length);
        const boxH = 148;

        for (let i = 0; i < photoPlans.length; i++) {
          const pp = photoPlans[i];
          const bx = 68 + i * (boxW + gap);
          try {
            const img = await new Promise((res, rej) => {
              const im = new Image();
              im.onload = () => res(im);
              im.onerror = rej;
              im.src = pp.photoDataUrl;
            });
            ctx.save();
            drawRoundedRect(ctx, bx, curY, boxW, boxH, 16);
            ctx.clip();
            // Center crop
            const scale = Math.max(boxW / img.width, boxH / img.height);
            const sw = img.width * scale;
            const sh = img.height * scale;
            ctx.drawImage(img, bx + (boxW - sw) / 2, curY + (boxH - sh) / 2, sw, sh);
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(bx, curY + boxH - 34, boxW, 34);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px "Noto Sans KR", sans-serif';
            ctx.fillText(pp.title.slice(0, 14), bx + 10, curY + boxH - 12);
            ctx.restore();
          } catch (e) {}
        }
        curY += boxH + 34;
      }

      // 5. 주요 여행 코스 하이라이트
      ctx.fillStyle = '#006194';
      ctx.font = 'bold 21px "Noto Sans KR", sans-serif';
      ctx.fillText('🗺️ 주요 여행 코스 & 별점 하이라이트', 68, curY);
      curY += 16;

      const sortedPlans = [...appState.plans]
        .sort((a, b) => ((b.rating || 0) - (a.rating || 0)) || (a.day - b.day) || a.time.localeCompare(b.time))
        .slice(0, photoPlans.length > 0 ? 5 : 7);

      sortedPlans.forEach((p, idx) => {
        drawRoundedRect(ctx, 68, curY, W - 136, 48, 12);
        ctx.fillStyle = idx % 2 === 0 ? '#eef2ff' : '#ffffff';
        ctx.fill();

        ctx.fillStyle = '#006194';
        ctx.font = 'bold 16px "Noto Sans KR", sans-serif';
        ctx.fillText(`Day ${p.day} · ${p.time}`, 84, curY + 30);

        ctx.fillStyle = '#131b2e';
        ctx.font = 'bold 17px "Noto Sans KR", sans-serif';
        ctx.fillText(p.title.slice(0, 22), 210, curY + 30);

        if (p.rating) {
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 17px "Noto Sans KR", sans-serif';
          ctx.fillText('★'.repeat(p.rating), W - 175, curY + 30);
        }
        curY += 56;
      });

      curY += 18;

      // 6. 경비 정산 요약 박스
      const boxTop = Math.max(curY, H - 275);
      drawRoundedRect(ctx, 68, boxTop, W - 136, 190, 20);
      ctx.fillStyle = '#006194';
      ctx.fill();

      ctx.fillStyle = '#93ccff';
      ctx.font = 'bold 17px "Noto Sans KR", sans-serif';
      ctx.fillText('💰 총 지출 경비 & 1인당 N빵 요약', 92, boxTop + 36);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 32px "Noto Sans KR", sans-serif';
      ctx.fillText(`총 ${settlement.totalExpenses.toLocaleString()}원`, 92, boxTop + 78);

      ctx.fillStyle = '#6cf8bb';
      ctx.font = 'bold 22px "Noto Sans KR", sans-serif';
      ctx.fillText(`(1인 평균 약 ${perPerson.toLocaleString()}원 · 총 ${settlement.expenseCount}건)`, 360, boxTop + 76);

      // 외화 합계 또는 최소 송금 요약
      ctx.fillStyle = '#eef0ff';
      ctx.font = '600 16px "Noto Sans KR", sans-serif';
      if (settlement.transfers.length > 0) {
        const tLines = settlement.transfers.slice(0, 3).map(t => `${t.fromName} → ${t.toName}: ${t.amount.toLocaleString()}원`).join('   |   ');
        ctx.fillText(`🚀 최소 송금: ${tLines}`, 92, boxTop + 122);
      } else {
        ctx.fillText('🎉 모든 멤버 정산 완료!', 92, boxTop + 122);
      }

      if (settlement.currencyTotals && Object.keys(settlement.currencyTotals).length > 0) {
        const fStr = Object.entries(settlement.currencyTotals).map(([c, v]) => {
          const info = SUPPORTED_CURRENCIES[c] || { flag: '', unit: c };
          return `${info.flag} ${v.toLocaleString()}${info.unit}`;
        }).join('  ·  ');
        ctx.fillStyle = '#cce5ff';
        ctx.fillText(`💱 현지 외화 결제 합계: ${fStr}`, 92, boxTop + 156);
      }

      // 하단 워터마크
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '600 15px "Noto Sans KR", sans-serif';
      ctx.fillText('Created with TripSync · 실시간 여행 동선 & N빵 정산 플래너', 48, H - 22);
    }

    async function shareTripSummaryImage() {
      const canvas = document.getElementById('tripSummaryCanvas');
      if (!canvas) return;
      try {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        if (blob && navigator.canShare) {
          const file = new File([blob], 'TripSync_Summary.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: appState.tripInfo.title,
              text: `${appState.tripInfo.title} 여행 코스 & 정산 요약 카드`,
              files: [file]
            });
            return;
          }
        }
      } catch (e) {}
      downloadTripSummaryImage();
    }

    function detectDestinationLang() {
      const dest = (appState.tripInfo?.destination || '').toLowerCase();
      if (/일본|후쿠오카|도쿄|오사카|교토|삿포로|오키나와|나고야|japan|fukuoka|tokyo|osaka/.test(dest)) return 'ja-JP';
      if (/대만|타이베이|가오슝|중국|상하이|홍콩|taiwan|taipei/.test(dest)) return 'zh-TW';
      if (/태국|방콕|푸켓|치앙마이|파타야|thailand|bangkok/.test(dest)) return 'th-TH';
      if (/베트남|다낭|나트랑|하노이|호치민|푸꾸옥|vietnam|danang/.test(dest)) return 'vi-VN';
      return 'ja-JP';
    }

    function speakPhrase(text, langCode) {
      if (!('speechSynthesis' in window)) {
        showToast('이 브라우저에서는 음성 합성을 지원하지 않습니다.');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = langCode || selectedPhraseLang || 'ja-JP';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
        showToast('🔊 현지어 음성을 재생합니다.');
      } catch (e) {
        showToast('음성 재생 중 오류가 발생했습니다.');
      }
    }

    function openTaxiCardForPlan(planId) {
      const plan = appState.plans.find(p => p.id === planId);
      if (!plan) return;
      const langKey = selectedPhraseLang || detectDestinationLang();
      const langObj = PHRASEBOOK_DATA[langKey] || PHRASEBOOK_DATA['ja-JP'];
      const placeDesc = [plan.title, plan.location].filter(Boolean).join(' · ');
      showBigPhraseCard(
        '기사님, 이 목적지까지 가주세요!',
        langObj.taxiHeader,
        langObj.taxiPron,
        langKey,
        placeDesc
      );
    }

      const text = document.getElementById('m_ph_custom_text')?.value.trim();
      if (!text) {
        alert('번역할 한국어 문장이나 메뉴명을 입력해주세요.');
        return;
      }
      const langKey = selectedPhraseLang || detectDestinationLang();
      const gCode = PHRASEBOOK_DATA[langKey]?.gCode || 'ja';
      const url = `https://translate.google.com/?sl=ko&tl=${gCode}&text=${encodeURIComponent(text)}&op=translate`;
      window.open(url, '_blank');
    }

    async function searchLocationCoords() {
      const locInput = document.getElementById('m_p_loc');
      const titleInput = document.getElementById('m_p_title');
      const badge = document.getElementById('m_p_coord_badge');
      const query = (locInput?.value.trim() || titleInput?.value.trim() || '');

      if (!query) {
        alert('장소명 또는 주소를 먼저 입력해주세요.');
        return;
      }

      // 1. 기본/내장 사전에서 먼저 검색 (오프라인 및 즉시 매칭)
      const matched = findCoordFromDict(query);
      if (matched) {
        document.getElementById('m_p_lat').value = matched.lat;
        document.getElementById('m_p_lng').value = matched.lng;
        if (badge) {
          badge.innerHTML = `
            <span class="text-secondary font-bold flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px]">check_circle</span>
              동선 지도 연동됨 (${matched.lat.toFixed(4)}, ${matched.lng.toFixed(4)})
            </span>
            <button type="button" onclick="clearPlanCoords()" class="text-on-surface-variant hover:text-error text-[10px]">해제</button>
          `;
        }
        showToast(`📍 '${query}' 위치 좌표를 찾았습니다!`);
        return;
      }

      if (badge) {
        badge.innerHTML = `
          <span class="text-primary font-semibold flex items-center gap-1">
            <span class="w-3 h-3 rounded-full border-2 border-primary border-t-transparent animate-spin"></span>
            오픈스트리트맵에서 위치 좌표 검색 중...
          </span>
        `;
      }

      try {
        // 검색어와 여행 목적지(후쿠오카 등) 함께 검색
        const dest = (appState.tripInfo?.destination || '').split(' ').pop() || '';
        const searchQuery = `${query} ${dest}`.trim();
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(searchQuery)}`;

        let res = await fetch(url, {
          headers: { 'Accept-Language': 'ko,en,ja' }
        });
        let data = await res.json();

        // 1차 검색 결과가 없으면 단일 검색어로 재시도
        if (!data || data.length === 0) {
          const fallbackUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
          res = await fetch(fallbackUrl, { headers: { 'Accept-Language': 'ko,en,ja' } });
          data = await res.json();
        }

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lng = parseFloat(data[0].lon);
          document.getElementById('m_p_lat').value = lat;
          document.getElementById('m_p_lng').value = lng;
          if (badge) {
            badge.innerHTML = `
              <span class="text-secondary font-bold flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">check_circle</span>
                동선 지도 연동됨 (${lat.toFixed(4)}, ${lng.toFixed(4)})
              </span>
              <button type="button" onclick="clearPlanCoords()" class="text-on-surface-variant hover:text-error text-[10px]">해제</button>
            `;
          }
          showToast(`📍 위치 좌표를 성공적으로 찾았습니다!`);
        } else {
          if (badge) {
            badge.innerHTML = `
              <span class="text-error font-semibold flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">warning</span>
                정확한 좌표를 찾지 못했습니다. 주소를 더 구체적으로 적어주세요.
              </span>
            `;
          }
          showToast('좌표 검색 결과가 없습니다.');
        }
      } catch (err) {
        if (badge) {
          badge.innerHTML = `
            <span class="text-error text-[11px]">검색 네트워크 오류가 발생했습니다.</span>
          `;
        }
      }
    }

    function handleSavePlan(e, editId) {
      e.preventDefault();
      const day = Number(document.getElementById('m_p_day').value);
      const time = document.getElementById('m_p_time').value;
      const title = document.getElementById('m_p_title').value.trim();
      const cat = document.getElementById('m_p_cat').value;
      const cost = parseInt(document.getElementById('m_p_cost').value, 10) || 0;
      const loc = document.getElementById('m_p_loc').value.trim();
      const memo = document.getElementById('m_p_memo').value.trim();

      const rawLat = document.getElementById('m_p_lat')?.value;
      const rawLng = document.getElementById('m_p_lng')?.value;
      let lat = rawLat ? parseFloat(rawLat) : undefined;
      let lng = rawLng ? parseFloat(rawLng) : undefined;

      // 만약 좌표가 비어있고 기본 매핑에 등록된 명칭인 경우 자동 보정
      if ((lat === undefined || isNaN(lat))) {
        const fallback = findCoordFromDict(loc) || findCoordFromDict(title);
        if (fallback) {
          lat = fallback.lat;
          lng = fallback.lng;
        }
      }

      const payload = {
        day,
        time,
        title,
        category: cat,
        costEstimate: cost,
        location: loc,
        lat: (!isNaN(lat) && typeof lat === 'number') ? lat : undefined,
        lng: (!isNaN(lng) && typeof lng === 'number') ? lng : undefined,
        placeUrl: loc ? `https://map.kakao.com/link/search/${encodeURIComponent(loc)}` : undefined,
        memo,
        completed: false
      };

      if (editId) {
        const p = appState.plans.find(item => item.id === editId);
        if (p) Object.assign(p, payload, { _updatedAt: Date.now() });
      } else {
        appState.plans.push({ id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`, _updatedAt: Date.now(), ...payload });
      }
      saveState();
      closeModal();
      renderPlanView();
      showToast(editId ? '일정이 수정되었습니다.' : '새 일정이 등록되었습니다.');

    function distributeEqualToCustomInputs() {
      const krwTotal = parseInt(document.getElementById('m_e_amount')?.value, 10) || 0;
      const checkedEls = Array.from(document.querySelectorAll("input[name='m_e_part']:checked"));
      const checkedIds = checkedEls.map(el => el.value);
      const count = checkedIds.length || 1;
      const baseShare = Math.floor(krwTotal / count);
      const rem = krwTotal % count;
      appState.friends.forEach(f => {
        const inp = document.getElementById(`m_e_custom_${f.id}`);
        if (!inp) return;
        const idx = checkedIds.indexOf(f.id);
        if (idx >= 0) {
          inp.value = krwTotal > 0 ? (baseShare + (idx < rem ? 1 : 0)) : '';
        } else {
          inp.value = 0;
        }
      });
      updateExpenseCurrencyCalc();
    }

    function updateExpenseCurrencyCalc() {
      const curCode = document.getElementById('m_e_currency')?.value || 'KRW';
      const krwInput = document.getElementById('m_e_amount');
      const previewSpan = document.getElementById('m_e_preview_per_share');
      if (!krwInput || !previewSpan) return;

      const checkedIds = Array.from(document.querySelectorAll("input[name='m_e_part']:checked")).map(el => el.value);
      const checkedParts = checkedIds.length || 1;

      let totalKrw = 0;
      if (curCode === 'KRW') {
        totalKrw = parseInt(krwInput.value, 10) || 0;
        const per = Math.round(totalKrw / checkedParts);
        previewSpan.innerText = `${per.toLocaleString()}원 (${checkedParts}명 분담)`;
      } else {
        const curInfo = SUPPORTED_CURRENCIES[curCode] || SUPPORTED_CURRENCIES.KRW;
        const foreignVal = parseFloat(document.getElementById('m_e_foreign_amount')?.value) || 0;
        const rateVal = parseFloat(document.getElementById('m_e_exchange_rate')?.value) || 0;
        const base = curInfo.baseUnit && curInfo.baseUnit > 1 ? curInfo.baseUnit : 1;

        totalKrw = Math.round(foreignVal * (rateVal / base));
        krwInput.value = totalKrw > 0 ? totalKrw : '';

        const perKRW = Math.round(totalKrw / checkedParts);
        const perForeign = (foreignVal / checkedParts).toFixed(foreignVal % checkedParts === 0 ? 0 : 1);
        previewSpan.innerText = `약 ${perKRW.toLocaleString()}원 (1인당 약 ${perForeign}${curInfo.unit})`;
      }

      // 차등 정산 합계 검증 안내
      const splitType = document.getElementById('m_e_split_type')?.value || 'equal';
      const diffHint = document.getElementById('m_e_custom_diff_hint');
      if (splitType === 'custom' && diffHint) {
        let sumCustom = 0;
        checkedIds.forEach(fid => {
          sumCustom += parseInt(document.getElementById(`m_e_custom_${fid}`)?.value, 10) || 0;
        });
        const diff = totalKrw - sumCustom;
        if (diff === 0) {
          diffHint.innerText = `✅ 멤버별 합계 일치 (${sumCustom.toLocaleString()}원)`;
          diffHint.className = 'text-[10px] font-bold text-secondary text-right';
        } else if (diff > 0) {
          diffHint.innerText = `⚠️ 총액보다 ${diff.toLocaleString()}원 부족합니다 (합계: ${sumCustom.toLocaleString()}원)`;
          diffHint.className = 'text-[10px] font-bold text-amber-600 text-right';
        } else {
          diffHint.innerText = `⚠️ 총액보다 ${Math.abs(diff).toLocaleString()}원 초과했습니다 (합계: ${sumCustom.toLocaleString()}원)`;
          diffHint.className = 'text-[10px] font-bold text-error text-right';
        }
      }
    }

    /* =========================================================================
       7-B. AI 영수증 사진 OCR & 결제 문자 자동 파서 (100% 무료 · 로컬 처리)
       ========================================================================= */
    let tesseractLoadPromise = null;

    function loadTesseractScript() {
      if (typeof window.Tesseract !== 'undefined') return Promise.resolve(window.Tesseract);
      if (tesseractLoadPromise) return tesseractLoadPromise;
      tesseractLoadPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = () => resolve(window.Tesseract);
        s.onerror = () => {
          tesseractLoadPromise = null;
          reject(new Error('OCR 엔진 로드 실패'));
        };
        document.head.appendChild(s);
      });
      return tesseractLoadPromise;
    }

    function detectCategoryFromText(text) {
      const t = text.toLowerCase();
      if (/라멘|ramen|스시|sushi|나베|식당|맛집|식사|고기|치킨|버거|피자|우동|소바|덮밥|돈까스|야키니쿠|restaurant|bistro|grill|kitchen|음식/.test(t)) return 'meal';
      if (/카페|cafe|coffee|커피|스타벅스|starbucks|베이커리|빵|디저트|아이스크림|투썸|이디야|블루보틀/.test(t)) return 'cafe';
      if (/호텔|hotel|숙소|에어비앤비|airbnb|료칸|리조트|resort|inn|호스텔|게스트하우스/.test(t)) return 'stay';
      if (/택시|taxi|지하철|metro|subway|버스|bus|공항|airport|jr|철도|신칸센|항공|주유|주차|uber|grab|교통/.test(t)) return 'transport';
      if (/이자카야|맥주|술|주점|포장마차|야식|bar|pub|beer|하이볼|와인|호프/.test(t)) return 'snack';
      if (/돈키호테|don\s?quijote|편의점|로손|lawson|세븐|seven|7-eleven|패밀리마트|familymart|마트|면세|쇼핑|유니클로|uniqlo|백화점|올리브영|다이소/.test(t)) return 'shopping';
      if (/타워|tower|입장권|티켓|ticket|박물관|미술관|온천|테마파크|유니버설|디즈니|수족관|전망대|투어/.test(t)) return 'activity';
      return 'other';
    }

    function parseReceiptText(rawText) {
      const text = (rawText || '').replace(/\r/g, '\n');
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

      // 1. 통화 감지
      let currency = 'KRW';
      if (/¥|￥|円|jpy|엔/i.test(text)) currency = 'JPY';
      else if (/nt\$|twd|대만달러|대만/i.test(text)) currency = 'TWD';
      else if (/\$|usd|달러/i.test(text)) currency = 'USD';
      else if (/€|eur|유로/i.test(text)) currency = 'EUR';
      else if (/₫|vnd|동(?:\s|$)/i.test(text)) currency = 'VND';
      else if (/฿|thb|바트/i.test(text)) currency = 'THB';
      else if (/원|krw/i.test(text)) currency = 'KRW';

      // 2. 금액 추출 (합계/결제금액 키워드 줄 최우선)
      const totalLineRegex = /(합계|총액|총금액|결제금액|승인금액|받을금액|카드결제|合計|お買上|領収|お支払|total|amount|grand\s*total|balance\s*due)/i;
      const extractNumbers = (str) => {
        // 전화번호·날짜·카드번호 형태 제거
        const cleaned = str
          .replace(/\d{2,4}[-./]\d{1,2}[-./]\d{1,2}/g, ' ')
          .replace(/\d{1,2}:\d{2}(:\d{2})?/g, ' ')
          .replace(/\d{2,4}-\d{3,4}-\d{4}/g, ' ');
        const matches = cleaned.match(/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g) || [];
        return matches
          .map(m => parseFloat(m.replace(/,/g, '')))
          .filter(n => !isNaN(n) && n >= 1 && n <= 100000000);
      };

      let amount = 0;
      for (const line of lines) {
        if (totalLineRegex.test(line)) {
          const nums = extractNumbers(line);
          if (nums.length > 0) {
            amount = Math.max(amount, ...nums);
          }
        }
      }
      // 통화 기호가 직접 붙은 숫자 우선 탐색 (예: 7,500엔, ¥3,200, 14,500원, $25.50)
      if (!amount) {
        const curNumRegex = /(?:[¥￥$€₫฿]\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?))|(?:(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(?:원|엔|円|달러|유로|바트|동|KRW|JPY|USD|EUR|VND|THB|TWD))/gi;
        let m;
        while ((m = curNumRegex.exec(text)) !== null) {
          const val = parseFloat((m[1] || m[2] || '0').replace(/,/g, ''));
          if (val > amount && val <= 100000000) amount = val;
        }
      }
      // 그래도 없으면 전체에서 가장 큰 합리적 금액 선택
      if (!amount) {
        const allNums = extractNumbers(text).filter(n => n >= 10 && n <= 50000000);
        if (allNums.length > 0) amount = Math.max(...allNums);
      }

      // 3. 날짜 추출
      let date = '';
      const fullDate = text.match(/(20\d{2})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
      if (fullDate) {
        date = `${fullDate[1]}-${fullDate[2].padStart(2, '0')}-${fullDate[3].padStart(2, '0')}`;
      } else {
        const shortDate = text.match(/(?:^|\s)(\d{1,2})[/.](\d{1,2})(?:\s|$)/);
        if (shortDate) {
          const yr = (appState.tripInfo.startDate || new Date().toISOString()).slice(0, 4);
          date = `${yr}-${shortDate[1].padStart(2, '0')}-${shortDate[2].padStart(2, '0')}`;
        }
      }

      // 4. 상호명/제목 추출
      const skipHeaderRegex = /^(\[?(web발신|신한|국민|삼성|현대|롯데|우리|하나|농협|카카오|토스|비씨|bc|카드)\]?|영수증|신용카드|매출전표|receipt|tax|tel|fax|사업자|대표자|주소|승인|일시|거래|\d+[-./:\s\d]+)$/i;
      let title = '';
      // 카드 문자 형식: "[신한카드] 07/15 19:30 이치란라멘 7,500엔 승인"
      if (lines.length <= 2) {
        const cleanedLine = text
          .replace(/\[[^\]]+\]/g, ' ')
          .replace(/(20\d{2}[-./])?\d{1,2}[-./]\d{1,2}/g, ' ')
          .replace(/\d{1,2}:\d{2}(:\d{2})?/g, ' ')
          .replace(/[¥￥$€₫฿]?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\s*(?:원|엔|円|달러|유로|바트|동|KRW|JPY|USD|EUR|VND|THB|TWD)?/gi, ' ')
          .replace(/(승인|결제|취소|일시불|할부|누적|잔액|사용|님|카드)/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (cleanedLine.length >= 2) title = cleanedLine.slice(0, 32);
      }
      if (!title) {
        for (const line of lines.slice(0, 8)) {
          const clean = line.replace(/[=*#\-_]{2,}/g, '').trim();
          if (clean.length >= 2 && clean.length <= 36 && !skipHeaderRegex.test(clean) && !/^\d[\d,.\s원엔¥$]+$/.test(clean)) {
            title = clean;
            break;
          }
        }
      }

      const category = detectCategoryFromText(text);
      return { title, currency, amount, date, category };
    }

    function applyParsedReceiptToModal(parsed, sourceLabel) {
      const titleEl = document.getElementById('m_e_title');
      const curEl = document.getElementById('m_e_currency');
      const foreignEl = document.getElementById('m_e_foreign_amount');
      const krwEl = document.getElementById('m_e_amount');
      const dateEl = document.getElementById('m_e_date');
      const catEl = document.getElementById('m_e_cat');

      if (parsed.title && titleEl) titleEl.value = parsed.title;
      if (parsed.currency && curEl && SUPPORTED_CURRENCIES[parsed.currency]) {
        curEl.value = parsed.currency;
        onExpenseCurrencyChange();
      }
      if (parsed.amount > 0) {
        if (parsed.currency === 'KRW' && krwEl) {
          krwEl.value = Math.round(parsed.amount);
        } else if (foreignEl) {
          foreignEl.value = parsed.amount;
        }
      }
      if (parsed.date && dateEl) dateEl.value = parsed.date;
      if (parsed.category && catEl) catEl.value = parsed.category;

      updateExpenseCurrencyCalc();

      const statusEl = document.getElementById('receiptOcrStatus');
      if (statusEl) {
        statusEl.classList.remove('hidden');
        const curInfo = SUPPORTED_CURRENCIES[parsed.currency || 'KRW'];
        statusEl.innerHTML = `✅ ${sourceLabel} 완료! ${parsed.title ? `[${parsed.title}] ` : ''}${parsed.amount > 0 ? `${parsed.amount.toLocaleString()}${curInfo.unit}` : '금액을 확인해주세요'} — 내용을 확인 후 저장하세요.`;
      }
      showToast(`✨ ${sourceLabel}으로 지출 내역이 자동 입력되었습니다!`);
    }

    async function handleReceiptImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const statusEl = document.getElementById('receiptOcrStatus');
      if (statusEl) {
        statusEl.classList.remove('hidden');
        statusEl.innerHTML = '⏳ 브라우저 내 무료 AI OCR 엔진 준비 중... (사진은 외부 서버로 전송되지 않습니다)';
      }

      try {
        const Tesseract = await loadTesseractScript();
        const result = await Tesseract.recognize(file, 'kor+eng+jpn', {
          logger: (m) => {
            if (statusEl && m.status === 'recognizing text') {
              const pct = Math.round((m.progress || 0) * 100);
              statusEl.innerHTML = `🔍 영수증 글자 인식 중... ${pct}% (로컬 처리)`;
            }
          }
        });
        const rawText = result?.data?.text || '';
        if (!rawText.trim()) {
          if (statusEl) statusEl.innerHTML = '⚠️ 영수증에서 글자를 찾지 못했습니다. 밝은 곳에서 선명하게 찍어 다시 시도해주세요.';
          return;
        }
        const parsed = parseReceiptText(rawText);
        applyParsedReceiptToModal(parsed, '영수증 사진 OCR 인식');
      } catch (err) {
        if (statusEl) statusEl.innerHTML = '⚠️ 영수증 인식 중 오류가 발생했습니다. 네트워크 연결을 확인하거나 문자 붙여넣기를 이용해주세요.';
      } finally {
        event.target.value = '';
      }
    }

    function handleSaveExpense(e, editId) {
      e.preventDefault();
      const title = document.getElementById('m_e_title').value.trim();
      const currency = document.getElementById('m_e_currency').value;
      const curInfo = SUPPORTED_CURRENCIES[currency] || SUPPORTED_CURRENCIES.KRW;
      const payerId = document.getElementById('m_e_payer').value;
      const category = document.getElementById('m_e_cat').value;
      const date = document.getElementById('m_e_date').value;
      const location = document.getElementById('m_e_loc').value.trim();
      const memo = document.getElementById('m_e_memo').value.trim();

      const checkedParts = Array.from(document.querySelectorAll("input[name='m_e_part']:checked")).map(el => el.value);
      if (checkedParts.length === 0) {
        alert('분할 대상을 최소 1명 이상 선택해주세요.');
        return;
      }

      let amount = 0;
      let foreignAmount = undefined;
      let exchangeRate = undefined;

      if (currency === 'KRW') {
        amount = parseInt(document.getElementById('m_e_amount').value, 10) || 0;
      } else {
        foreignAmount = parseFloat(document.getElementById('m_e_foreign_amount').value) || 0;
        const base = curInfo.baseUnit && curInfo.baseUnit > 1 ? curInfo.baseUnit : 1;
        const rateInput = parseFloat(document.getElementById('m_e_exchange_rate').value) || 0;
        exchangeRate = rateInput / base;
        amount = Math.round(foreignAmount * exchangeRate);
      }

      if (amount <= 0) {
        alert('올바른 결제 금액을 입력해주세요.');
        return;
      }

      const splitType = document.getElementById('m_e_split_type')?.value || 'equal';
      let customSplits = undefined;
      if (splitType === 'custom') {
        customSplits = {};
        let sumCustom = 0;
        checkedParts.forEach(fid => {
          const val = parseInt(document.getElementById(`m_e_custom_${fid}`)?.value, 10) || 0;
          customSplits[fid] = val;
          sumCustom += val;
        });
        if (Math.abs(amount - sumCustom) > 10) {
          if (!confirm(`멤버별 입력 합계(${sumCustom.toLocaleString()}원)가 총 결제액(${amount.toLocaleString()}원)과 다릅니다.\n차액(${(amount - sumCustom).toLocaleString()}원)을 첫 번째 멤버에게 자동 반영하여 저장할까요?`)) {
            return;
          }
        }
      }

      const payload = {
        title,
        currency,
        foreignAmount: foreignAmount > 0 ? foreignAmount : undefined,
        exchangeRate: exchangeRate > 0 ? exchangeRate : undefined,
        amount,
        payerId,
        category,
        date,
        location,
        memo,
        participantIds: checkedParts,
        splitType,
        customSplits
      };

      if (editId) {
        const exp = appState.expenses.find(item => item.id === editId);
        if (exp) Object.assign(exp, payload, { _updatedAt: Date.now() });
      } else {
        appState.expenses.unshift({ id: `e_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`, createdAt: Date.now(), _updatedAt: Date.now(), ...payload });
      }
      saveState();
      closeModal();
      renderExpenseView();
      showToast(editId ? '지출 내역이 수정되었습니다.' : '새 지출이 등록되었습니다.');
    }

    let sheetJsLoadPromise = null;
    let deferredPwaPrompt = null;

    function loadSheetJsScript() {
      if (typeof window.XLSX !== 'undefined') return Promise.resolve(window.XLSX);
      if (sheetJsLoadPromise) return sheetJsLoadPromise;
      sheetJsLoadPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
        s.onload = () => resolve(window.XLSX);
        s.onerror = () => {
          sheetJsLoadPromise = null;
          reject(new Error('엑셀 라이브러리 로드 실패'));
        };
        document.head.appendChild(s);
      });
      return sheetJsLoadPromise;
    }

            e.date || '',
            e.title || '',
            catLabel,
            friendNameMap[e.payerId] || '',
            e.currency || 'KRW',
            e.foreignAmount || '',
            e.exchangeRate ? Number(e.exchangeRate.toFixed(2)) : '',
            e.amount || 0,
            parts,
            e.location || '',
            e.memo || ''
          ]);
        });
        const wsExp = XLSX.utils.aoa_to_sheet(expenseRows);
        wsExp['!cols'] = [{ wch: 12 }, { wch: 26 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 22 }, { wch: 18 }, { wch: 24 }];
        XLSX.utils.book_append_sheet(wb, wsExp, '지출 상세');

        // 시트 3: 여행 일정
        const planRows = [
          ['일차', '시간', '일정명', '카테고리', '장소', '예상 경비(원)', '방문 여부', '메모']
        ];
        const sortedPlans = [...appState.plans].sort((a, b) => (a.day - b.day) || a.time.localeCompare(b.time));
        sortedPlans.forEach(p => {
          const catLabel = PLAN_CATEGORIES[p.category]?.label || p.category || '기타';
          planRows.push([
            `Day ${p.day}`,
            p.time || '',
            p.title || '',
            catLabel,
            p.location || '',
            p.costEstimate || 0,
            p.completed ? '완료' : '예정',
            p.memo || ''
          ]);
        });
        const wsPlan = XLSX.utils.aoa_to_sheet(planRows);
        wsPlan['!cols'] = [{ wch: 8 }, { wch: 8 }, { wch: 28 }, { wch: 10 }, { wch: 22 }, { wch: 14 }, { wch: 10 }, { wch: 28 }];
        XLSX.utils.book_append_sheet(wb, wsPlan, '여행 일정');

        // 시트 4: 준비물
        const checkRows = [['구분', '준비물', '담당자', '완료 여부']];
        appState.checklists.forEach(c => {
          checkRows.push([
            c.type === 'shared' ? '공동' : '개인',
            c.text || '',
            c.assignedTo ? (friendNameMap[c.assignedTo] || '') : '',
            c.completed ? '완료' : '미완료'
          ]);
        });
        const wsCheck = XLSX.utils.aoa_to_sheet(checkRows);
        wsCheck['!cols'] = [{ wch: 8 }, { wch: 30 }, { wch: 12 }, { wch: 10 }];
        XLSX.utils.book_append_sheet(wb, wsCheck, '준비물');

        const safeTitle = (appState.tripInfo.title || 'TripSync').replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 20);
        const dateTag = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        XLSX.writeFile(wb, `TripSync_${safeTitle}_${dateTag}.xlsx`);
        showToast('📊 엑셀(.xlsx) 파일이 다운로드되었습니다!');
      } catch (err) {
        showToast('엑셀 내보내기 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
      }
    }

    function initPwaSupport() {
      const btn = document.getElementById('btnInstallPwa');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      // Service Worker 등록 (오프라인 실행 및 앱 설치 요건)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      // Android / PC Chrome 설치 이벤트 감지
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPwaPrompt = e;
        if (btn && !isStandalone) {
          btn.classList.remove('hidden');
          btn.classList.add('flex');
        }
      });

      window.addEventListener('appinstalled', () => {
        deferredPwaPrompt = null;
        if (btn) btn.classList.add('hidden');
        showToast('📲 TripSync 앱이 홈 화면에 설치되었습니다!');
      });

      // iOS Safari에서는 수동 설치 안내 버튼 노출
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isIos && !isStandalone && btn) {
        btn.classList.remove('hidden');
        btn.classList.add('flex');
      }
    }

    async function installPwaApp() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        const { outcome } = await deferredPwaPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredPwaPrompt = null;
          document.getElementById('btnInstallPwa')?.classList.add('hidden');
        }
        return;
      }
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isIos) {
        alert('📲 아이폰(Safari) 앱 설치 방법:\n\n1. 화면 하단의 [공유(↑)] 버튼을 누르세요.\n2. [홈 화면에 추가]를 선택하면 앱처럼 설치됩니다!');
      } else {
        alert('📲 브라우저 주소창 오른쪽의 [앱 설치] 아이콘 또는 메뉴의 [홈 화면에 추가]를 눌러 설치할 수 있습니다.');
      }
    }

    /* =========================================================================
       8. INITIALIZATION
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', async () => {
      initPwaSupport();
      renderAll();
      // 1. 로컬 Wi-Fi 서버 정보 조회 및 동기화 (실행 중인 경우)
      await fetchServerInfo();
      await checkAndSyncLocalServer(true);
      // 2. If Gist in URL or configured, auto fetch
      const urlParams = new URLSearchParams(window.location.search);
      const urlGist = urlParams.get('gist');
      if (urlGist || syncConfig.gistId) {
        fetchFromGist(true);
      }
    });
  </script>
</body>
